# Topic pages: the criteria by technical area instead of BSI domain, for
# engineering teams that own one part of their system.
#
# AI-generated. Claude (Anthropic) chose the topics, assigned the criteria and
# wrote the introductions, from the BSI C5:2026 criterion text (DE v1.1.0,
# EN v1.0.1). Assignment is per criterion; `subs` restricts a criterion to the
# sub-criteria that belong to the topic where it is mixed. A criterion can be
# in several topics. scripts/lib/ai.mjs checks that every criterion and
# sub-criterion exists in both languages. The criterion text is authoritative.
#
# Rule for a topic: it draws from at least three BSI domains (otherwise the
# domain page already covers it) and is named in engineering terms.
#
# Reviewed on 2026-10-18 against the full German text of every assigned
# criterion and of every criterion in no topic.

